[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oomol-fusion-sdk"
version = "2.0.0"
description = "Python SDK for Fusion API task and action endpoints"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "OOMOL" }
]
keywords = ["oomol", "fusion", "sdk", "api", "python", "ai", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/oomol/oomol-fusion-sdk-py"
Repository = "https://github.com/oomol/oomol-fusion-sdk-py.git"
Documentation = "https://github.com/oomol/oomol-fusion-sdk-py#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oomol_fusion_sdk*"]
